
deploymentMode: SingleBinary

serviceAccount:
  create: false
  name: loki

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: s3
    bucketNames:
      chunks: voting-loki-chunks-836003244254-eu-north-1
      ruler: voting-loki-ruler-836003244254-eu-north-1
      admin: voting-loki-chunks-836003244254-eu-north-1
    s3:
      region: eu-north-1

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: voting-gp3
    size: 10Gi

chunksCache:
  enabled: false

resultsCache:
  enabled: false

minio:
  enabled: false

gateway:
  enabled: true
read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0
